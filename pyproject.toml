[project]
name = "xbooklibrary"
version = "0.1.0"
description = "Calibre-style book library with agentic metadata, multi-format ingestion, summarization, and library-wise RAG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.19",
    "watchfiles>=1.0.0",
    "ebooklib>=0.18",
    "pypdf>=5.1.0",
    "pypdfium2>=4.30.0",
    "python-docx>=1.1.2",
    "chardet>=5.2.0",
    "lxml>=5.3.0",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
